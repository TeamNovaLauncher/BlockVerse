<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlockVerse</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#101522;color:#f4f6fb;min-height:100vh;display:grid;place-items:center;padding:20px}
    main{width:min(100%,440px);background:#1a2335;border:1px solid #303d56;border-radius:18px;padding:26px;box-shadow:0 18px 60px #0005}
    h1{margin:0 0 8px;font-size:30px}p{color:#aebbd1;line-height:1.45}.tabs{display:flex;gap:8px;margin:20px 0}
    button,input{font:inherit;border-radius:10px;padding:12px;width:100%}button{border:0;background:#5865f2;color:white;font-weight:700;cursor:pointer}
    .tabs button{background:#2a3650}.tabs button.active{background:#5865f2}input{background:#101827;border:1px solid #3a4965;color:white;margin:7px 0}
    #message{min-height:24px;color:#b9c8ff;font-size:14px}#profile{display:none;border-top:1px solid #35425b;margin-top:20px;padding-top:16px}
    .muted{font-size:13px;color:#91a0b8}
  </style>
</head>
<body>
<main>
  <h1>BlockVerse</h1>
  <p>Глобальные аккаунты на Firebase.</p>
  <div id="auth">
    <div class="tabs">
      <button id="loginTab" class="active" type="button">Вход</button>
      <button id="registerTab" type="button">Регистрация</button>
    </div>
    <form id="authForm">
      <input id="email" type="email" placeholder="Электронная почта" autocomplete="email" required>
      <input id="password" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password" minlength="6" required>
      <button id="submitBtn" type="submit">Войти</button>
    </form>
  </div>
  <div id="profile">
    <h2>Аккаунт</h2>
    <p id="userEmail"></p>
    <p id="userRole"></p>
    <button id="logoutBtn" type="button">Выйти</button>
  </div>
  <p id="message" role="status"></p>
  <p class="muted">BlockVerse — стартовая версия системы аккаунтов. Игровые миры и мультиплеер пока не добавлены.</p>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
