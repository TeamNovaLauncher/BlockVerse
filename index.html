<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlockVerse</title>
<style>
:root{--bg:#f7f7f8;--ink:#191919;--muted:#707078;--line:#e5e5e8;--blue:#335fff;--dark:#202127}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Arial,Helvetica,sans-serif}button,input{font:inherit}button{cursor:pointer}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:0 24px;position:sticky;top:0;z-index:5}.brand{font-weight:900;font-size:23px;letter-spacing:-1.4px;white-space:nowrap}.brand b{background:#191919;color:white;padding:4px 7px;border-radius:7px;margin-right:4px}.search{max-width:480px;flex:1;position:relative}.search input{width:100%;height:38px;border:1px solid #dedee3;background:#f6f6f7;border-radius:9px;padding:0 14px 0 38px;outline:none}.search:before{content:'⌕';position:absolute;left:13px;top:5px;font-size:23px;color:#777}.topright{margin-left:auto;display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;background:#e7eaff;display:grid;place-items:center;font-weight:bold;color:#3556db}.pill{border:0;border-radius:8px;padding:10px 15px;font-weight:700}.primary{background:var(--blue);color:white}.ghost{background:#f0f0f2;color:#24242a}.layout{display:grid;grid-template-columns:218px minmax(0,1fr);max-width:1500px;margin:auto}.side{padding:22px 14px;border-right:1px solid var(--line);min-height:calc(100vh - 62px);background:#fff}.nav{display:flex;align-items:center;gap:13px;width:100%;border:0;background:transparent;padding:12px 13px;text-align:left;border-radius:9px;color:#444;font-weight:600;margin:2px 0}.nav .ico{width:22px;text-align:center;font-size:18px}.nav.active{background:#edf0ff;color:#284ee8}.side hr{border:0;border-top:1px solid var(--line);margin:16px 5px}.side small{color:#96969e;padding:0 13px;font-weight:bold}.main{padding:27px 32px 70px;min-width:0}.welcome{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:23px}.welcome h1{font-size:28px;letter-spacing:-.8px;margin:0 0 6px}.welcome p{margin:0;color:var(--muted)}.hero{background:linear-gradient(110deg,#222b48,#3856a8 58%,#6b83e5);border-radius:15px;min-height:205px;color:white;padding:26px 30px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;position:relative;margin-bottom:28px}.hero h2{font-size:29px;max-width:480px;margin:0 0 10px;letter-spacing:-.8px}.hero p{color:#e1e7ff;margin:0 0 19px}.hero-art{font-size:104px;filter:drop-shadow(0 14px 8px #1116);transform:rotate(-8deg);margin-right:45px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:25px 0 14px}.sectionhead h2{font-size:21px;margin:0;letter-spacing:-.4px}.sectionhead a{font-size:13px;color:#3158ef;font-weight:bold;cursor:pointer}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:5px}.chip{border:1px solid #dedee4;background:white;border-radius:30px;padding:8px 14px;white-space:nowrap;color:#4e4e56;font-weight:600}.chip.active{background:#202127;color:white;border-color:#202127}.games{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.game{min-width:0;cursor:pointer}.thumb{height:145px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:inset 0 -25px 45px #0002}.thumb:after{content:'';position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,#0003)}.thumb .emoji{font-size:64px;filter:drop-shadow(0 9px 6px #0003);z-index:1;transition:transform .2s}.game:hover .emoji{transform:scale(1.1) translateY(-4px)}.t1{background:linear-gradient(135deg,#6ed6ff,#3777da)}.t2{background:linear-gradient(135deg,#7fe0a4,#248b70)}.t3{background:linear-gradient(135deg,#ffcf78,#ed704e)}.t4{background:linear-gradient(135deg,#b6a2ff,#6852c8)}.t5{background:linear-gradient(135deg,#f7a6c5,#a83f7d)}.t6{background:linear-gradient(135deg,#9fe2df,#358c9d)}.t7{background:linear-gradient(135deg,#9cabc4,#424e69)}.t8{background:linear-gradient(135deg,#f0e28a,#d49b2e)}.gamename{font-weight:700;margin:9px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#777}.online{color:#24945c}.empty{padding:30px;color:#777}.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:22px;max-width:650px}.panel h2{margin-top:0}.field{display:block;width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0 14px}.authwrap{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(140deg,#edf0ff,#f8f8fa)}.authbox{background:white;width:min(100%,410px);padding:28px;border-radius:16px;box-shadow:0 15px 50px #18204418}.authbox h1{margin:0 0 8px}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{flex:1;padding:10px;border:0;border-radius:8px;background:#f0f0f3;font-weight:bold}.tabs button.active{background:#202127;color:white}#message{color:#c33;min-height:22px;font-size:13px}.muted{color:#777;font-size:13px;line-height:1.5}.hide{display:none!important}.gameview{background:#171923;color:white;border-radius:14px;padding:24px;min-height:300px}.gameview button{margin-top:10px}.profileline{display:flex;align-items:center;gap:15px}.bigavatar{width:76px;height:76px;border-radius:15px;background:#e7eaff;display:grid;place-items:center;font-size:38px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#202127;color:white;padding:12px 18px;border-radius:9px;z-index:10}
@media(max-width:1050px){.games{grid-template-columns:repeat(3,minmax(0,1fr))}.thumb{height:130px}}
@media(max-width:720px){.top{padding:0 12px;gap:10px}.brand{font-size:19px}.topright .pill{display:none}.layout{grid-template-columns:64px minmax(0,1fr)}.side{padding:16px 7px}.nav{justify-content:center;padding:12px 5px}.nav .txt,.side small,.side hr{display:none}.main{padding:20px 14px}.games{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.thumb{height:118px}.hero{padding:20px;min-height:170px}.hero h2{font-size:23px}.hero-art{font-size:70px;margin-right:0}.welcome h1{font-size:23px}}
</style>
</head>
<body>
<div id="authScreen" class="authwrap">
 <section class="authbox"><div class="brand"><b>B</b>BlockVerse</div><h1 style="margin-top:24px">Добро пожаловать!</h1><p class="muted">Войди, чтобы открывать миры и создавать свои.</p>
 <div class="tabs"><button id="loginTab" class="active" type="button">Вход</button><button id="registerTab" type="button">Регистрация</button></div>
 <form id="authForm"><input class="field" id="email" type="email" placeholder="Электронная почта" autocomplete="email" required><input class="field" id="password" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password" minlength="6" required><button id="submitBtn" class="pill primary" style="width:100%" type="submit">Войти</button></form><p id="message"></p></section>
</div>
<div id="appScreen" class="hide">
<header class="top"><div class="brand"><b>B</b>BlockVerse</div><div class="search"><input id="searchInput" placeholder="Поиск игр и миров"></div><div class="topright"><button class="pill ghost" id="createTop">＋ Создать</button><div class="avatar" id="topAvatar">B</div></div></header>
<div class="layout"><aside class="side">
<button class="nav active" data-page="discover"><span class="ico">⌂</span><span class="txt">Главная</span></button>
<button class="nav" data-page="discover"><span class="ico">♧</span><span class="txt">Открыть игры</span></button>
<button class="nav" data-page="rewards"><span class="ico">🎁</span><span class="txt">Награды</span></button>\n<button class="nav" data-page="avatar"><span class="ico">♟</span><span class="txt">Аватар</span></button>
<button class="nav" data-page="create"><span class="ico">▧</span><span class="txt">Создать</span></button>
<hr><small>ЛИЧНОЕ</small>
<button class="nav" data-page="profile"><span class="ico">◉</span><span class="txt">Профиль</span></button>
<button class="nav" id="logoutBtn"><span class="ico">⇥</span><span class="txt">Выйти</span></button>
</aside><main class="main" id="main"></main></div>
</div>
<div id="toast" class="toast hide"></div>
<script type="module" src="./app.js?v=20261116fix1"></script>
</body></html>
